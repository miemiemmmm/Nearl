# Builds nearl.all_actions with nvcc on a GPU-less runner (no nvidia-smi, so
# src/Makefile falls back to sm_80), then installs it and checks the extension
# imports. Catches build breakage only; a wrong kernel needs a real GPU.
name: CUDA build

"on":
  push:
    branches: ["main"]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3-dev
          pip install pybind11

      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.6.0"

      - name: Compile nearl.all_actions
        run: |
          cd src
          make all_actions
          test -f all_actions.so

  install:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ python3-dev
          pip install pybind11 setuptools wheel

      - uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.6.0"

      - name: Install nearl with CUDA extension
        run: |
          pip install . --no-deps --no-build-isolation
          # cd out of the repo so the import resolves to the install, not src
          cd /tmp && python -c "from nearl import all_actions"
