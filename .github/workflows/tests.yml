# Runs the CPU-only subset of pytests/ on every push/PR: TrajectoryLoader,
# Dataset, Featurizer parameter logic, logging, and model instantiation. A
# real gate -- unlike validate-pytraj-install.yml, failure here fails the
# workflow.
#
# Excluded, and NOT covered by this job:
#   - test_actions.py, test_benchmark.py, test_features.py: call
#     nearl.all_actions directly, which is CUDA-only (no CPU fallback) and
#     unbuilt here (no nvcc on this runner -- setup.py skips it gracefully).
#   - test_visualization.py: needs an interactive display.
# Exercising those needs a GPU-equipped runner; see the note this repo
# currently has none configured.
name: Tests (CPU)

"on":
  push:
    branches: ["main"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pulls pytraj in via ambertools (conda-forge's pre-built binary)
      # rather than scripts/instant_pytraj.sh's from-source build: this job
      # just needs *a* working pytraj to run the test suite reliably, and a
      # conda-forge binary sidesteps the toolchain-matching fragility of
      # building from source (see validate-pytraj-install.yml, which
      # exists specifically to canary-test that from-source script itself).
      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: nearl_ci
          create-args: >-
            python=3.12
            ambertools
            numpy
            h5py
            scipy
            pytorch-cpu
            rdkit
            openbabel
            scikit-learn
            joblib
            pytest
          channels: conda-forge

      # No nvcc on this runner -- setup.py's build_ext skips nearl.all_actions
      # with a warning instead of failing the install. Regular (non-editable)
      # build+install, not `pip install -e .`.
      - name: Install nearl
        shell: bash -el {0}
        run: pip install . --no-build-isolation

      - name: Run CPU-safe tests
        shell: bash -el {0}
        run: |
          pytest pytests/ -q \
            --ignore=pytests/test_actions.py \
            --ignore=pytests/test_benchmark.py \
            --ignore=pytests/test_features.py \
            --ignore=pytests/test_visualization.py
