# Conda/Mamba environment for developing/testing Nearl: GPU-enabled PyTorch, 
# plus the testing and training tools not needed just to import
# the package.
# 
# Create the test environment with:
#   micromamba env create -f requirements.yml
#
# NOTE: PyTraj 3.0.X.X should be installed separately
# Directly using pip install pytraj installs old version that
# is not compatible with the latest python versions.

name: nearl_env

channels:
  - conda-forge
  - anaconda

dependencies:
  - python=3.12               # Tested with Python 3.12
  - clang-format=23           # Major version pinned by scripts/format_cpp.sh
  - h5py
  - line_profiler
  - matplotlib
  - numpy
  - pandas
  - pybind11                  # Required to build nearl.all_actions
  - pytorch-gpu>=2.13         # CUDA build; conda-forge resolves the variant
  - pip>=20.1
  - ruff=0.16.5               # Version pinned by scripts/format_python.sh
  - scipy
  - seaborn
  - scikit-learn
  - pip:
    - rdkit
    - openbabel
    - tensorboard
    - pytest
    - pytest-benchmark
    - open3d
